<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect fill="#f3f4f6" width="400" height="400"/>
  <g transform="translate(200, 200)">
    <!-- Package box outline -->
    <rect x="-60" y="-50" width="120" height="100" fill="none" stroke="#d1d5db" stroke-width="2" rx="4"/>
    <!-- Package flap -->
    <path d="M -60 -50 L 0 -20 L 60 -50" fill="none" stroke="#d1d5db" stroke-width="2"/>
    <!-- Center line -->
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#d1d5db" stroke-width="1"/>
    <!-- Ribbon -->
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#e5e7eb" stroke-width="2"/>
  </g>
  <!-- Text -->
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="16" fill="#9ca3af" text-anchor="middle">No Product Image</text>
</svg>